<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Will You Be My Valentine?</title>
        <style>
            *{
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            }


            body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #ff9a9e, #fad0c4);
            }


            .card {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
            max-width: 400px;
            width: 90%;
            background-image: url("us1.png");
            }


            h1 {
            color: #e63946;
            margin-bottom: 20px;
            font-size: 2.2rem;
            }
            p {
            color: #444;
            margin-bottom: 30px;
            font-size: 1.1rem;
            }


            .buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            }


            button {
            padding: 12px 25px;
            border: none;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            }


            #yesBtn {
            background-color: #e63946;
            color: white;
            box-shadow: 0 8px 20px rgba(230, 57, 70, 0.4);
            }


            #noBtn {
            background-color: #ddd;
            color: #333;
            }


            button:hover {
            transform: scale(1.05);
            }


            .message {
            margin-top: 25px;
            font-size: 1.3rem;
            color: #e63946;
            display: none;
            }
        </style>
        </head>
    <body>
        <div class="card">
            <h1 id="h1">❤️ Mar, my love, will you be my valentine? ❤️</h1>
            <p>You make my days brighter and my heart happier.</p>


            <div class="buttons">
                <button id="yesBtn">Yes 💕</button>
                <button id="noBtn">No 🙈</button>
            </div>


            <div class="message" id="message">
                Yay! 💖 I can't wait to spend Valentine's Day with you!
            </div>
        </div>


        <script>
            const yesBtn = document.getElementById('yesBtn');
            const noBtn = document.getElementById('noBtn');
            const message = document.getElementById('message');


            yesBtn.addEventListener('click', () => {
                message.style.display = 'block';
                yesBtn.style.display = 'none';
                noBtn.style.display = 'none';
            });


            noBtn.addEventListener('mouseover', () => {
                const x = Math.random() * 200;
                const y = Math.random() * 200;
                noBtn.style.transform = `translate(${x}px, ${y}px)`;
                noBtn.onclick = function(){
                    alert("Illegal action!!!")
                }
            });
        </script>
    </body>
</html>
